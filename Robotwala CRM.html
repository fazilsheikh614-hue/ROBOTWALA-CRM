<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Robotwala CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arvo:wght@700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: white app shell, left rail nav with red active pill, content on a faintly tinted ground. White and red only, navy-biased ink from the robot's visor. */
:root{
  --red:#D8201A; --red-dark:#B01510; --red-soft:#FDECEA; --red-line:#F3CFCB;
  --ink:#1C2140; --muted:#5E6483; --bg:#FFF9F8; --card:#FFFFFF; --line:#EFE2E0;
  --ok:#1E7F47; --ok-soft:#E6F4EC; --warn:#9A5B00; --warn-soft:#FFF1D6;
  --display:"Arvo","Rockwell","Roboto Slab",Georgia,serif;
  --body:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1.5px solid var(--red);background:var(--red);color:#fff;
  padding:.55rem 1rem;border-radius:8px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--red-dark);border-color:var(--red-dark)}
.btn.ghost{background:#fff;color:var(--red)}
.btn.ghost:hover{background:var(--red-soft)}
.btn.sm{padding:.3rem .65rem;font-size:13px}
.btn.plain{border-color:var(--line);color:var(--ink);background:#fff}
.btn.plain:hover{background:var(--red-soft);border-color:var(--red-line)}
.btn.danger{background:#fff;color:var(--red-dark);border-color:var(--red-line)}
.btn.danger:hover{background:var(--red);color:#fff}

/* login */
#login{min-height:100%;display:grid;grid-template-columns:1.05fr 1fr}
.l-art{background:var(--red);display:grid;place-items:center;padding:clamp(24px,5vw,56px);position:relative;overflow:hidden}
.l-art::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:rgba(255,255,255,.09);right:-170px;bottom:-190px}
.l-logo{background:#fff;border-radius:22px;padding:clamp(18px,3vw,40px);width:min(100%,540px);position:relative;z-index:1;box-shadow:0 24px 60px rgba(60,0,0,.28)}
.l-logo img{display:block;width:100%;height:auto}
.l-form{display:flex;align-items:center;justify-content:center;padding:clamp(24px,5vw,56px);background:#fff}
.l-box{width:100%;max-width:380px;display:grid;gap:18px}
.l-box h1{font-size:28px}
.l-box .sub{color:var(--muted);margin:-8px 0 0}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--red-line);border-radius:10px;padding:3px;gap:3px;background:var(--red-soft)}
.seg button{border:0;background:transparent;padding:.55rem;border-radius:8px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.fld{display:grid;gap:5px}
.fld label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line);border-radius:8px;padding:.6rem .75rem;background:#fff;width:100%;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--red);outline:none;box-shadow:0 0 0 3px var(--red-soft)}
.fld textarea{resize:vertical;min-height:70px}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--red);font-weight:700;cursor:pointer;padding:.3rem .5rem}
.err{background:var(--red-soft);color:var(--red-dark);border:1px solid var(--red-line);padding:.55rem .75rem;border-radius:8px;font-weight:600;font-size:14px}
.l-note{font-size:12.5px;color:var(--muted)}

/* shell */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
#side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand img{height:40px;width:auto}
.brand b{font-family:var(--display);font-size:19px;color:var(--red);letter-spacing:.02em}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:.6rem .75rem;border-radius:8px;font-weight:700;color:var(--ink);cursor:pointer}
.nav button:hover{background:var(--red-soft)}
.nav button[aria-current="page"]{background:var(--red);color:#fff}
.nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.who{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px;font-size:13px}
.who b{display:block;font-size:14px;overflow-wrap:anywhere}
.who span{color:var(--muted);overflow-wrap:anywhere}
.role-tag{display:inline-block;background:var(--red-soft);color:var(--red-dark);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;width:fit-content}
#main{min-width:0;display:flex;flex-direction:column}
.top{display:none}
#view{padding:28px clamp(16px,3vw,36px) 48px;max-width:1180px;width:100%;display:grid;gap:22px;align-content:start}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{font-size:26px}
.head p{margin:4px 0 0;color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h2{font-size:17px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:2px}
.stat span{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-size:30px;color:var(--red);line-height:1.1}
.banner{background:var(--red-soft);border:1px solid var(--red-line);border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{margin:0;flex:1 1 260px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:.7rem .9rem;background:var(--red-soft);border-bottom:1px solid var(--red-line);white-space:nowrap}
td{padding:.7rem .9rem;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .sub{color:var(--muted);font-size:13px}
td.act{white-space:nowrap;text-align:right}
td.act .btn+.btn{margin-left:6px}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:17px;margin-bottom:4px}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--red-soft);color:var(--red-dark)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.off{background:#EEF0F6;color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters .fld{flex:1 1 150px;min-width:0}

/* chart */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:170px;border-bottom:1.5px solid var(--line);padding-bottom:0}
.bar{display:grid;grid-template-rows:1fr auto;height:100%;gap:6px;text-align:center;min-width:0}
.bar .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar .fill{width:100%;max-width:38px;background:var(--red);border-radius:6px 6px 0 0;min-height:3px}
.bar .fill.none{background:var(--line)}
.bar small{font-weight:800;font-size:12px}
.labels{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;text-align:center;font-size:12px;color:var(--muted);margin-top:6px}
.rows{display:grid;gap:0}
.rows>div{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--line)}
.rows>div:last-child{border-bottom:0}
.rows .sub{color:var(--muted);font-size:13px}

/* attendance */
.roster{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.rrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:.6rem .9rem;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow .rn{font-weight:800;color:var(--muted)}
.pal{display:flex;gap:4px}
.pal button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:.35rem .7rem;font-weight:800;cursor:pointer;min-width:84px}
.pal button[data-v="P"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.pal button[data-v="A"][aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.pal button[data-v="L"][aria-pressed="true"]{background:#C98500;border-color:#C98500;color:#fff}
.sumbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:.6rem 1rem;font-weight:800;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--red);border-color:var(--red)}


/* professional polish */
.card,.stat,.tw,.roster{box-shadow:0 1px 2px rgba(28,33,64,.04),0 6px 20px rgba(28,33,64,.05)}
.btn{box-shadow:0 1px 2px rgba(216,32,26,.25)}
.btn.plain,.btn.ghost,.btn.danger{box-shadow:none}
.brand b{display:block;line-height:1.1}
.brand small{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:2px}
.nav button{font-size:14px;padding:.62rem .8rem}
tbody tr:hover td{background:#FFFBFA}
td{font-size:14px}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--red-soft);color:var(--red-dark);font-weight:800;font-size:12px;flex:none;border:1px solid var(--red-line)}
.pn{display:flex;gap:10px;align-items:center;min-width:0}
.pn .sub{display:block}
.hero{background:linear-gradient(120deg,var(--red) 0%,var(--red-dark) 100%);color:#fff;border-radius:14px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08);right:-60px;top:-110px}
.hero h1{font-size:26px;color:#fff;position:relative;z-index:1}
.hero p{margin:4px 0 0;opacity:.92;position:relative;z-index:1}
.datechip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:.4rem .8rem;border-radius:99px;font-weight:700;font-size:13px;position:relative;z-index:1}
.stat{display:flex;align-items:center;gap:14px;padding:16px}
.stat .ic{width:42px;height:42px;border-radius:11px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;flex:none}
.stat .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat b{display:block;font-size:28px}
.att-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.calcard{position:sticky;top:16px}
.sel-date{font-family:var(--display);font-size:15px;margin:-4px 0 12px;color:var(--red-dark)}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-h b{font-family:var(--display);font-size:15px}
.cal-nav{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:20px;line-height:1;color:var(--ink)}
.cal-nav:hover{background:var(--red-soft);border-color:var(--red-line)}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-w span{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.cal-d{aspect-ratio:1;border:1px solid transparent;background:transparent;border-radius:9px;cursor:pointer;font-weight:700;position:relative;padding:0;min-width:0}
.cal-d:hover:not(:disabled){background:var(--red-soft)}
.cal-d.now{border-color:var(--red)}
.cal-d.sel,.cal-d.sel:hover{background:var(--red);color:#fff;border-color:var(--red)}
.cal-d:disabled{color:#C3C5D3;cursor:not-allowed}
.cal-d.has::after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--red)}
.cal-d.sel.has::after{background:#fff}
.cal-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.legend{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.legend i{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block}
.cal-foot .tools{gap:6px}


/* phone */
#bnav{display:none}
@media (max-width:820px){
  #bnav:not([hidden]){display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(28,33,64,.08);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:25}
  #bnav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:800;color:var(--muted);padding:6px 2px;border-radius:10px;cursor:pointer;min-width:0}
  #bnav button[aria-current="page"]{color:var(--red);background:var(--red-soft)}
  #bnav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #view{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .fld input,.fld select,.fld textarea{font-size:16px}
}
@media (max-width:640px){
  .head h1,.hero h1{font-size:22px}
  .hero{padding:18px}
  .btn{padding:.65rem 1rem}
  .btn.sm{padding:.5rem .8rem}
  .head .tools,.head .tools .btn{width:100%}
  .head .tools .btn{justify-content:center}
  .tw{border:0;box-shadow:none;background:transparent;overflow:visible}
  .tw table,.tw thead,.tw tbody,.tw tr,.tw td{display:block;width:100%;min-width:0}
  .tw thead{display:none}
  .tw tr{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:4px 14px;box-shadow:0 1px 2px rgba(28,33,64,.04),0 6px 20px rgba(28,33,64,.05)}
  .tw td{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px dashed var(--line);padding:.6rem 0;text-align:right;overflow-wrap:anywhere}
  .tw td::before{content:attr(data-label);flex:none;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left}
  .tw td:last-child{border-bottom:0}
  .tw td.act{justify-content:flex-end;flex-wrap:wrap}
  .tw td.act::before{display:none}
  .tw td.act .btn{flex:1}
  .tw td .pn{justify-content:flex-end}
  .tw tbody tr:hover td{background:transparent}
  .tw .empty{background:#fff;border:1px solid var(--line);border-radius:12px}
  .sumbar{flex-direction:column;align-items:stretch}
  .sumbar .tools{width:100%}
  .sumbar .tools .btn{flex:1}
  .dlg{padding:18px}
}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(28,33,64,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow-y:auto}
.dlg{background:#fff;border-radius:14px;width:100%;max-width:480px;max-height:100%;overflow-y:auto;display:grid;gap:14px;padding:22px;border-top:5px solid var(--red)}
.dlg h2{font-size:20px}
.dlg .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg .btns{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.dlg p{margin:0;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:.65rem 1.1rem;border-radius:10px;font-weight:700;z-index:60;max-width:calc(100% - 32px)}

@media (max-width:900px){
  .grid2{grid-template-columns:1fr}
  .att-layout{grid-template-columns:minmax(0,1fr)}
  .calcard{position:static}
  .att-layout aside{order:-1}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  #login{grid-template-columns:1fr}
  .l-art{padding:22px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px));padding-top:max(22px,env(safe-area-inset-top,0px))}
  .l-logo{width:min(100%,320px);padding:14px;border-radius:16px}
  #app{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-102%);transition:transform .2s;height:100%;padding-left:max(14px,env(safe-area-inset-left,0px))}
  #side.open{transform:none;box-shadow:0 0 40px rgba(28,33,64,.3)}
  .top{display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .top img{height:32px;width:auto}
  .top b{font-family:var(--display);color:var(--red)}
  .top .menu{margin-left:auto}
  .scrim{position:fixed;inset:0;background:rgba(28,33,64,.4);z-index:30}
  #view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .rrow{grid-template-columns:40px 1fr}
  .rrow .pal{grid-column:1/-1}
  .pal button{flex:1;min-width:0}
}
@media (max-width:520px){
  .dlg .two{grid-template-columns:1fr}
  .stat b{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
"use strict";
var KEY="robotwala_crm_v1", SKEY="robotwala_session_v1";
var HR_EMAIL="fazilsheikh614@gmail.com";
var HR_HASH="9051672214e4dcaec05cee330553fe78c947bbefb2c06502fb805b6818379fdc";

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function pad(n){return (n<10?"0":"")+n}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return ymd(new Date())}
function fmtDate(s){var d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}
function fmtShort(s){var d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})}
function wk(s){var d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-IN",{weekday:"short"})}
function ini(n){var p=String(n||"?").trim().split(/\s+/);return esc((p[0][0]||"")+(p.length>1?p[p.length-1][0]:"")).toUpperCase()}
function norm(s){return String(s||"").trim().toLowerCase()}
function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2600)}

function sha256(a){
  a=unescape(encodeURIComponent(a));
  var mp=Math.pow,mw=mp(2,32),i,j,r="",w=[],al=a.length*8,h=[],k=[],pc=0,ip={};
  function rr(v,n){return (v>>>n)|(v<<(32-n))}
  for(var c=2;pc<64;c++){if(!ip[c]){for(i=0;i<313;i+=c)ip[i]=c;h[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}
  a+="\x80";while(a.length%64-56)a+="\x00";
  for(i=0;i<a.length;i++){j=a.charCodeAt(i);w[i>>2]|=j<<((3-i)%4)*8}
  w[w.length]=(al/mw)|0;w[w.length]=al;
  for(j=0;j<w.length;){
    var W=w.slice(j,j+=16),oh=h;h=h.slice(0,8);
    for(i=0;i<64;i++){
      var w15=W[i-15],w2=W[i-2],a0=h[0],e0=h[4];
      var t1=h[7]+(rr(e0,6)^rr(e0,11)^rr(e0,25))+((e0&h[5])^(~e0&h[6]))+k[i]+(W[i]=(i<16)?W[i]:(W[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+W[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a0,2)^rr(a0,13)^rr(a0,22))+((a0&h[1])^(a0&h[2])^(h[1]&h[2]));
      h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0;
    }
    for(i=0;i<8;i++)h[i]=(h[i]+oh[i])|0;
  }
  for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(h[i]>>(j*8))&255;r+=((b<16)?0:"")+b.toString(16)}
  return r;
}
function hashPw(email,pw){return sha256("robotwala|"+norm(email)+"|"+pw)}

/* ---------- data ---------- */
var DB=null, S={user:null,role:null,view:"dashboard",att:null,attTab:"take",rec:{school:"",cls:"",date:""},cal:{},q:{},cls:{}};

function seed(){
  var hrId="u_fazil";
  var db={v:1,users:[{id:hrId,name:"Fazil Sheikh",email:HR_EMAIL,phone:"",hash:HR_HASH,roles:["hr","trainer"],active:true,created:today()}],schools:[],students:[],attendance:[]};
  return db;
}
function load(){try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){DB=null}
  if(!DB||!DB.users){DB=seed();save()}
  /* remove the example records that older versions created */
  var ids={},n=DB.schools.length+DB.students.length+DB.attendance.length;
  DB.schools.forEach(function(s){if(s.sample)ids[s.id]=1});
  DB.schools=DB.schools.filter(function(s){return !s.sample});
  DB.students=DB.students.filter(function(s){return !s.sample&&!ids[s.schoolId]});
  DB.attendance=DB.attendance.filter(function(a){return !a.sample&&!ids[a.schoolId]});
  if(n!==DB.schools.length+DB.students.length+DB.attendance.length)save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function byId(list,id){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];return null}
function userName(id){var u=byId(DB.users,id);return u?u.name:"Unassigned"}
function schoolName(id){var s=byId(DB.schools,id);return s?s.name:"Unknown school"}

function isHR(){return S.role==="hr"}
function mySchools(){return isHR()?DB.schools:DB.schools.filter(function(s){return s.trainerId===S.user.id})}
function mySchoolIds(){var o={};mySchools().forEach(function(s){o[s.id]=1});return o}
function myStudents(){var ids=mySchoolIds();return DB.students.filter(function(s){return ids[s.schoolId]})}
function myAttendance(){var ids=mySchoolIds();return DB.attendance.filter(function(a){return ids[a.schoolId]})}
function trainers(){return DB.users.filter(function(u){return u.roles.indexOf("trainer")>-1})}
function classesOf(schoolId){var o={};DB.students.forEach(function(s){if(s.schoolId===schoolId)o[s.cls]=1});return Object.keys(o).sort(function(a,b){return a-b})}
function byRoll(a,b){return (parseInt(a.roll,10)||0)-(parseInt(b.roll,10)||0)}
function counts(marks,studentIds){var c={P:0,A:0,L:0};studentIds.forEach(function(id){if(marks[id])c[marks[id]]++});return c}
function activeIds(a){return DB.students.filter(function(s){return s.schoolId===a.schoolId&&s.cls===a.cls}).map(function(s){return s.id}).filter(function(id){return a.marks[id]})}
function rate(list){var p=0,t=0;list.forEach(function(a){var ids=Object.keys(a.marks);ids.forEach(function(id){if(!byId(DB.students,id))return;t++;if(a.marks[id]!=="A")p++})});return t?Math.round(p*100/t):null}

/* ---------- modal ---------- */
function field(label,name,val,o){
  o=o||{};var id="f_"+name,req=o.required?" required":"";
  var h='<div class="fld"><label for="'+id+'">'+esc(label)+'</label>';
  if(o.options){
    h+='<select id="'+id+'" name="'+name+'"'+req+(o.disabled?" disabled":"")+'>';
    if(o.placeholder)h+='<option value="">'+esc(o.placeholder)+'</option>';
    o.options.forEach(function(op){h+='<option value="'+esc(op[0])+'"'+(String(op[0])===String(val)?" selected":"")+'>'+esc(op[1])+'</option>'});
    h+='</select>';
  }else if(o.area){h+='<textarea id="'+id+'" name="'+name+'"'+req+'>'+esc(val)+'</textarea>'}
  else h+='<input id="'+id+'" name="'+name+'" type="'+(o.type||"text")+'" value="'+esc(val)+'"'+req+(o.ph?' placeholder="'+esc(o.ph)+'"':"")+(o.inputmode?' inputmode="'+o.inputmode+'"':"")+(o.autocomplete?' autocomplete="'+o.autocomplete+'"':' autocomplete="off"')+'>';
  return h+'</div>';
}
function modal(o){
  var root=$("#modalRoot");
  root.innerHTML='<div class="ov" id="ov"><form class="dlg" id="mform" role="dialog" aria-modal="true" aria-label="'+esc(o.title)+'"><h2>'+esc(o.title)+'</h2>'+o.body+'<div class="err" id="merr" role="alert" hidden></div><div class="btns"><button type="button" class="btn plain" id="mcancel">Cancel</button><button type="submit" class="btn'+(o.danger?" danger":"")+'">'+esc(o.submit||"Save")+'</button></div></form></div>';
  function close(){root.innerHTML="";document.removeEventListener("keydown",onKey)}
  function onKey(e){if(e.key==="Escape")close()}
  document.addEventListener("keydown",onKey);
  $("#mcancel").onclick=close;
  $("#ov").addEventListener("mousedown",function(e){if(e.target.id==="ov")close()});
  $("#mform").addEventListener("submit",function(e){
    e.preventDefault();
    var fd={};$$("#mform [name]").forEach(function(el){fd[el.name]=(el.value||"").trim()});
    var res=o.onSubmit?o.onSubmit(fd):null;
    if(typeof res==="string"){var m=$("#merr");m.textContent=res;m.hidden=false;return}
    close();
  });
  var first=$("#mform input,#mform select,#mform textarea");if(first&&!o.danger)first.focus();

  if(isHR()&&hasSample())h+='<div class="banner"><p><b>Example data is loaded.</b> Two sample schools and a few students show how the CRM works. Remove them when you are ready to add your own.</p><button class="btn sm" data-act="clearSample" type="button">Remove example data</button></div>';

    stat("Present today",tRate==null?"—":tRate+"%","attendance")+'</div>';
  /* 7 day chart */
  var days=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(ymd(d))}
  var bars="",labs="";

    var r=rate(att.filter(function(a){return a.date===ds}));
    bars+='<div class="bar"><div class="col"><small class="num">'+(r==null?"":r+"%")+'</small><div class="fill'+(r==null?" none":"")+'" style="height:'+(r==null?3:Math.max(r*1.15,4))+'px"></div></div><span></span></div>';
    labs+='<div>'+wk(ds)+'<br>'+fmtShort(ds)+'</div>';
  });
  h+='<div class="grid2"><section class="card"><h2>Attendance, last 7 days</h2><div class="bars">'+bars+'</div><div class="labels">'+labs+'</div></section>';
  /* today by school */
  var rows="";
  schools.forEach(function(s){
    var cl=classesOf(s.id),done=0;
    cl.forEach(function(c){if(att.some(function(a){return a.schoolId===s.id&&a.cls===c&&a.date===t}))done++});
    var pill=!cl.length?'<span class="pill off">No students</span>':done===cl.length?'<span class="pill ok">All taken</span>':done?'<span class="pill warn">'+done+' of '+cl.length+' classes</span>':'<span class="pill">Pending</span>';
    rows+='<div><div><b>'+esc(s.name)+'</b><div class="sub">'+esc(userName(s.trainerId))+'</div></div>'+pill+'</div>';
  });
  h+='<section class="card"><h2>Today by school</h2>'+(rows?'<div class="rows">'+rows+'</div>':'<div class="empty"><b>No schools yet</b>Add a school to start taking attendance.</div>')+'</section></div>';
  /* recent students */
  var rec=students.slice().sort(function(a,b){return String(b.created).localeCompare(String(a.created))}).slice(0,5);
  h+='<section class="card"><h2>Recently added students</h2>'+(rec.length?'<div class="tw"><table><thead><tr><th>Name</th><th>Class</th><th>School</th><th>Parent phone</th></tr></thead><tbody>'+rec.map(function(s){return '<tr><td><b>'+esc(s.name)+'</b></td><td>Class '+esc(s.cls)+'</td><td>'+esc(schoolName(s.schoolId))+'</td><td class="num">'+esc(s.phone)+'</td></tr>'}).join("")+'</tbody></table></div>':'<div class="empty"><b>No students yet</b>Add students from the Students page.</div>')+'</section>';

function calendar(key,sel,marked,maxToday){

  var t=today(),dim=new Date(c.y,c.m+1,0).getDate(),dow=new Date(c.y,c.m,1).getDay();

  for(var i=0;i<dow;i++)h+="<span></span>";

    var m=a.marks[s.id];
    return '<div class="rrow"><span class="rn num">'+esc(s.roll)+'</span><b>'+esc(s.name)+'</b><div class="pal" role="group" aria-label="Attendance for '+esc(s.name)+'">'+
     [["P","Present"],["A","Absent"],["L","Late"]].map(function(x){return '<button type="button" data-act="mark" data-sid="'+s.id+'" data-v="'+x[0]+'" aria-pressed="'+(m===x[0])+'">'+x[1]+'</button>'}).join("")+'</div></div>';
  }).join("")+'</div>';
  return h;
}
function attRecords(){
  var r=S.rec,sch=mySchools();
  var cl=r.school?classesOf(r.school):classRange();
  var h='<div class="filters"><div class="fld"><label for="rSchool">School</label><select id="rSchool" data-r="school"><option value="">All schools</option>'+sch.map(function(s){return '<option value="'+s.id+'"'+(s.id===r.school?" selected":"")+'>'+esc(s.name)+'</option>'}).join("")+'</select></div>'+
   '<div class="fld"><label for="rClass">Class</label><select id="rClass" data-r="cls"><option value="">All classes</option>'+cl.map(function(c){return '<option value="'+c+'"'+(c===r.cls?" selected":"")+'>Class '+c+'</option>'}).join("")+'</select></div></div>';
  h+='<div class="att-layout"><div id="recList">'+recList()+'</div><aside class="card calcard"><h2>View by date</h2><div class="sel-date">'+(r.date?esc(fmtLong(r.date)):"All dates")+'</div>'+calendar("rec",r.date,markedDates(r.school,r.cls),false)+'<div class="cal-foot"><span class="legend"><i></i>Attendance saved</span><span class="tools"><button class="btn plain sm" data-act="calClear" type="button">All dates</button><button class="btn plain sm" data-act="calToday" type="button">Today</button></span></div></aside></div>';
  return h;
}
function recList(){
  var r=S.rec;
  var base=myAttendance().filter(function(a){return (!r.school||a.schoolId===r.school)&&(!r.cls||a.cls===r.cls)});
  var L=base.filter(function(a){return !r.date||a.date===r.date}).sort(function(a,b){return b.date.localeCompare(a.date)||schoolName(a.schoolId).localeCompare(schoolName(b.schoolId))});
  var h="";
  if(!L.length)return '<div class="tw"><div class="empty"><b>No attendance records</b>'+(r.date?"Nothing was saved on this date. Pick another date on the calendar.":"Records appear after attendance is saved for a class.")+'</div></div>';
  h+='<div class="tw"><table><thead><tr><th>Date</th><th>School</th><th>Class</th><th>Taken by</th><th>Present</th><th>Absent</th><th>Late</th><th>Rate</th><th></th></tr></thead><tbody>'+L.map(function(a){
    var c=counts(a.marks,Object.keys(a.marks).filter(function(id){return byId(DB.students,id)}));var rt=rate([a]);
    return '<tr><td class="num">'+fmtDate(a.date)+'</td><td>'+esc(schoolName(a.schoolId))+'</td><td>Class '+esc(a.cls)+'</td><td>'+esc(userName(a.trainerId))+'</td><td class="num">'+c.P+'</td><td class="num">'+c.A+'</td><td class="num">'+c.L+'</td><td class="num">'+(rt==null?"—":rt+"%")+'</td><td class="act"><button class="btn plain sm" data-act="openRec" data-id="'+a.id+'" type="button">'+(isHR()?"Open / edit":"Open")+'</button>'+(isHR()?'<button class="btn danger sm" data-act="delRec" data-id="'+a.id+'" type="button">Delete</button>':"")+'</td></tr>';
  }).join("")+'</tbody></table></div>';
  if(r.school&&r.cls){
    var studs=DB.students.filter(function(s){return s.schoolId===r.school&&s.cls===r.cls}).sort(byRoll);
    h+='<section class="card" style="margin-top:18px"><h2>Student summary, Class '+esc(r.cls)+' (all dates)</h2><div class="tw"><table><thead><tr><th>Roll</th><th>Student</th><th>Present</th><th>Late</th><th>Absent</th><th>Attendance</th></tr></thead><tbody>'+studs.map(function(s){
      var p=0,l=0,ab=0;base.forEach(function(a){var m=a.marks[s.id];if(m==="P")p++;else if(m==="L")l++;else if(m==="A")ab++});
      var t=p+l+ab;return '<tr><td class="num">'+esc(s.roll)+'</td><td><b>'+esc(s.name)+'</b></td><td class="num">'+p+'</td><td class="num">'+l+'</td><td class="num">'+ab+'</td><td class="num">'+(t?Math.round((p+l)*100/t)+"%":"—")+'</td></tr>';
    }).join("")+'</tbody></table></div></section>';
  }
  return h;
}
function afterAtt(){}

/* settings */
function vSettings(){
  var h=head("Settings","Account and data options.");
  h+='<section class="card"><h2>Change my password</h2><form id="pwForm" style="display:grid;gap:12px;max-width:380px"><div class="fld"><label for="pwCur">Current password</label><input id="pwCur" type="password" required autocomplete="current-password"></div><div class="fld"><label for="pwNew">New password</label><input id="pwNew" type="password" required minlength="6" autocomplete="new-password"></div><div class="fld"><label for="pwNew2">Confirm new password</label><input id="pwNew2" type="password" required minlength="6" autocomplete="new-password"></div><div class="err" id="pwErr" hidden></div><div><button class="btn" type="submit">Update password</button></div></form></section>';
  if(isHR()){
    h+='<section class="card"><h2>Data</h2><p style="margin:0 0 12px;color:var(--muted)">Data is kept in this browser. Use backup to copy everything to another device or browser, then restore it there.</p><div class="tools"><button class="btn plain" data-act="backup" type="button">Backup data</button><button class="btn plain" data-act="restore" type="button">Restore from backup</button>'+(hasSample()?'<button class="btn ghost" data-act="clearSample" type="button">Remove example data</button>':"")+'<button class="btn danger" data-act="resetAll" type="button">Erase all data</button></div></section>';
  }
  return h;
}

/* ---------- session ---------- */
function persistSession(){try{sessionStorage.setItem(SKEY,JSON.stringify({id:S.user.id,role:S.role}))}catch(e){}}
function enter(user,role){
  S.user=user;S.role=role;S.view="dashboard";S.att=null;S.cal={};S.rec={school:"",cls:"",date:""};S.attTab="take";S.q={};S.cls={};
  persistSession();
  $("#login").hidden=true;$("#app").hidden=false;
  $("#whoName").textContent=user.name;$("#whoMail").textContent=user.email;
  $("#whoRole").textContent=role==="hr"?"HR / Admin":"Trainer";
  renderNav();render();window.scrollTo(0,0);
}
function leave(){
  S.user=null;S.role=null;try{sessionStorage.removeItem(SKEY)}catch(e){}
  $("#app").hidden=true;$("#bnav").hidden=true;$("#login").hidden=false;$("#lPass").value="";closeMenu();$("#modalRoot").innerHTML="";
}

/* ---------- events ---------- */
var loginRole="hr";
$$(".seg button").forEach(function(b){b.addEventListener("click",function(){
  loginRole=b.dataset.role;$$(".seg button").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});$("#lErr").hidden=true;
})});
$("#showPw").addEventListener("click",function(){var i=$("#lPass");var show=i.type==="password";i.type=show?"text":"password";this.textContent=show?"Hide":"Show"});
$("#loginForm").addEventListener("submit",function(e){
  e.preventDefault();
  var email=norm($("#lEmail").value),pw=$("#lPass").value,err=$("#lErr");
  var u=DB.users.filter(function(x){return norm(x.email)===email})[0];
  if(!u||u.hash!==hashPw(email,pw)){err.textContent="Email or password is incorrect.";err.hidden=false;return}
  if(u.roles.indexOf(loginRole)<0){err.textContent=loginRole==="hr"?"This account does not have HR access. Sign in as Trainer instead.":"This account is not a trainer.";err.hidden=false;return}
  if(!u.active){err.textContent="This account is disabled. Please contact HR.";err.hidden=false;return}
  err.hidden=true;enter(u,loginRole);
});
$("#logout").addEventListener("click",leave);
$("#menuBtn").addEventListener("click",openMenu);
$("#scrim").addEventListener("click",closeMenu);
function onNav(e){var b=e.target.closest("[data-nav]");if(b)go(b.dataset.nav)}
$("#nav").addEventListener("click",onNav);$("#bnav").addEventListener("click",onNav);
function labelTables(){$$("#view table").forEach(function(tb){var hs=$$("th",tb).map(function(h){return h.textContent});$$("tbody tr",tb).forEach(function(tr){$$("td",tr).forEach(function(td,i){if(hs[i]!==undefined&&td.getAttribute("data-label")!==hs[i])td.setAttribute("data-label",hs[i])})})})}
new MutationObserver(labelTables).observe($("#view"),{childList:true,subtree:true});

var view=$("#view");
view.addEventListener("input",function(e){
  var q=e.target.dataset.q;
  if(q){S.q[q]=e.target.value;$("#list").innerHTML=({tr:listTrainers,sc:listSchools,st:listStudents})[q]()}
});
view.addEventListener("change",function(e){
  var t=e.target,d=t.dataset;
  if(d.f){S.cls[d.f]=t.value;$("#list").innerHTML=listStudents()}
  else if(d.a){
    var a=S.att;a[d.a]=t.value;
    if(d.a==="school"){var cl=classesOf(a.school);a.cls=cl[0]||""}
    loadAtt();render();
  }else if(d.r){
    S.rec[d.r]=t.value;if(d.r==="school")S.rec.cls="";render();
  }
});
view.addEventListener("click",function(e){
  var cn=e.target.closest("[data-calnav]");
  if(cn){var k=cn.closest(".cal").dataset.cal,c=S.cal[k];c.m+=parseInt(cn.dataset.calnav,10);if(c.m<0){c.m=11;c.y--}if(c.m>11){c.m=0;c.y++}render();return}
  var dd=e.target.closest("[data-day]");
  if(dd){var k2=dd.closest(".cal").dataset.cal;if(k2==="take"){S.att.date=dd.dataset.day;loadAtt()}else{S.rec.date=S.rec.date===dd.dataset.day?"":dd.dataset.day}render();return}
  var tab=e.target.closest("[data-tab]");if(tab){S.attTab=tab.dataset.tab;render();return}
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.dataset.act,id=b.dataset.id;
  if(act==="calToday"){if(S.attTab==="take"){S.att.date=today();S.cal.take=null;loadAtt()}else{S.rec.date=today();S.cal.rec=null}render()}
  else if(act==="calClear"){S.rec.date="";render()}
  else if(act==="addTrainer")trainerForm();
  else if(act==="editTrainer")trainerForm(byId(DB.users,id));
  else if(act==="delTrainer"){var u=byId(DB.users,id);confirmBox("Remove trainer?","<b>"+esc(u.name)+"</b> will no longer be able to sign in. Their schools stay in the CRM but need a new trainer.","Remove trainer",function(){
    DB.users=DB.users.filter(function(x){return x.id!==id});DB.schools.forEach(function(s){if(s.trainerId===id)s.trainerId=""});save();toast("Trainer removed");render()})}
  else if(act==="addSchool")schoolForm();
  else if(act==="editSchool")schoolForm(byId(DB.schools,id));
  else if(act==="delSchool"){var sc=byId(DB.schools,id);confirmBox("Remove school?","<b>"+esc(sc.name)+"</b>, all of its students and their attendance records will be deleted.","Remove school",function(){
    DB.schools=DB.schools.filter(function(x){return x.id!==id});DB.students=DB.students.filter(function(x){return x.schoolId!==id});DB.attendance=DB.attendance.filter(function(x){return x.schoolId!==id});S.att=null;save();toast("School removed");render()})}
  else if(act==="addStudent")studentForm();
  else if(act==="editStudent")studentForm(byId(DB.students,id));
  else if(act==="delStudent"){var st=byId(DB.students,id);confirmBox("Remove student?","<b>"+esc(st.name)+"</b> will be removed from the class list and from attendance.","Remove student",function(){
    DB.students=DB.students.filter(function(x){return x.id!==id});DB.attendance.forEach(function(a){delete a.marks[id]});save();toast("Student removed");render()})}
  else if(act==="mark"){S.att.marks[b.dataset.sid]=b.dataset.v;$("#roster").innerHTML=rosterHtml()}
  else if(act==="allP"){Object.keys(S.att.marks).forEach(function(k){S.att.marks[k]="P"});$("#roster").innerHTML=rosterHtml()}
  else if(act==="saveAtt"){
    var a=S.att;
    var rec=DB.attendance.filter(function(r){return r.schoolId===a.school&&r.cls===a.cls&&r.date===a.date})[0];
    var marks=JSON.parse(JSON.stringify(a.marks));
    if(rec){rec.marks=marks;rec.trainerId=S.user.id;delete rec.sample}
    else DB.attendance.push({id:"a_"+uid(),schoolId:a.school,cls:a.cls,date:a.date,trainerId:S.user.id,marks:marks});
    save();a.saved=true;toast("Attendance saved for Class "+a.cls+", "+fmtShort(a.date));$("#roster").innerHTML=rosterHtml();
  }
  else if(act==="openRec"){var r=byId(DB.attendance,id);S.att={school:r.schoolId,cls:r.cls,date:r.date,marks:{}};S.cal.take=null;loadAtt();S.attTab="take";render();window.scrollTo(0,0)}
  else if(act==="delRec"){confirmBox("Delete this record?","The attendance for this class and date will be deleted.","Delete record",function(){DB.attendance=DB.attendance.filter(function(x){return x.id!==id});save();toast("Record deleted");render()})}
  else if(act==="clearSample"){confirmBox("Remove example data?","The example schools, students and attendance are deleted. Your own entries stay.","Remove example data",function(){
    var ids={};DB.schools.forEach(function(s){if(s.sample)ids[s.id]=1});
    DB.schools=DB.schools.filter(function(s){return !s.sample});
    DB.students=DB.students.filter(function(s){return !s.sample&&!ids[s.schoolId]});
    DB.attendance=DB.attendance.filter(function(a){return !a.sample&&!ids[a.schoolId]});
    S.att=null;save();toast("Example data removed");render()})}
  else if(act==="resetAll"){confirmBox("Erase all data?","Every trainer, school, student and attendance record is deleted. Only the main HR account stays.","Erase everything",function(){
    DB.users=DB.users.filter(function(u){return u.email===HR_EMAIL});DB.schools=[];DB.students=[];DB.attendance=[];S.att=null;save();toast("All data erased");render()})}
  else if(act==="backup"){
    modal({title:"Backup data",submit:"Copy to clipboard",body:'<p>Copy this text and keep it safe. Paste it into Restore on another device.</p><div class="fld"><label for="f_bk">Backup</label><textarea id="f_bk" name="bk" readonly style="min-height:160px;font-family:monospace;font-size:12px">'+esc(JSON.stringify(DB))+'</textarea></div>',
      onSubmit:function(){var t=$("#f_bk");t.select();try{navigator.clipboard.writeText(t.value).then(function(){toast("Backup copied")},function(){toast("Select the text and copy it")})}catch(x){toast("Select the text and copy it")}return "Copy started. You can close this window.";}});
  }
  else if(act==="restore"){
    modal({title:"Restore from backup",submit:"Restore",body:'<p>Paste a backup. It replaces the data in this browser.</p>'+field("Backup text","bk","",{area:1,required:1}),
      onSubmit:function(f){var d;try{d=JSON.parse(f.bk)}catch(x){return "That is not a valid backup."}
        if(!d||!d.users||!d.schools||!d.students||!d.attendance)return "That backup is missing data.";
        DB=d;save();var me=byId(DB.users,S.user.id)||DB.users.filter(function(u){return norm(u.email)===norm(S.user.email)})[0];
        if(!me){toast("Restored. Please sign in again.");leave();return}
        S.user=me;S.att=null;toast("Backup restored");render()}});
  }
});
view.addEventListener("submit",function(e){
  if(e.target.id!=="pwForm")return;
  e.preventDefault();
  var cur=$("#pwCur").value,n1=$("#pwNew").value,n2=$("#pwNew2").value,err=$("#pwErr");
  function bad(m){err.textContent=m;err.hidden=false}
  if(S.user.hash!==hashPw(S.user.email,cur))return bad("Current password is incorrect.");
  if(n1.length<6)return bad("New password must be at least 6 characters.");
  if(n1!==n2)return bad("The two new passwords do not match.");
  var rec=byId(DB.users,S.user.id);rec.hash=hashPw(rec.email,n1);S.user=rec;save();toast("Password updated");render();
});

/* ---------- boot ---------- */
load();
try{
  var ss=JSON.parse(sessionStorage.getItem(SKEY));
  if(ss){var u=byId(DB.users,ss.id);if(u&&u.active&&u.roles.indexOf(ss.role)>-1)enter(u,ss.role)}
}catch(e){}
})();
</script>

</body></html>
